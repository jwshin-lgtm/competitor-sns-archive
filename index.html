  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDEFF2;
      --ink-soft:#A6ADB8;
      --bg:#14171C;
      --surface:#1B1F26;
      --border:#2A2F38;
      --accent:#3FBF9F;
      --accent-soft:#183B33;
      --accent-ink:#8FE6CC;
      --warn-bg:#3A2E13;
      --warn-ink:#E8B860;
      --ok-bg:#183B33;

      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDEFF2;
    --ink-soft:#A6ADB8;
    --bg:#14171C;
    --surface:#1B1F26;
    --border:#2A2F38;
    --accent:#3FBF9F;
    --accent-soft:#183B33;
    --accent-ink:#8FE6CC;
    --warn-bg:#3A2E13;
    --warn-ink:#E8B860;
    --ok-bg:#183B33;
    --ok-ink:#8FE6CC;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR","Pretendard",-apple-system,sans-serif;
    padding:0 16px;
    padding-block:24px 100px;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}

  .wrap{max-width:1080px;margin:0 auto;}

  header.page{margin-bottom:24px;}
  header.page .eyebrow{
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent-ink);font-weight:700;margin-bottom:8px;
  }
  header.page h1{
    font-size:clamp(24px,4vw,32px);
    margin:0 0 8px;
    letter-spacing:-0.02em;
    text-wrap:balance;
  }
  header.page p{
    color:var(--ink-soft);
    margin:0;
    max-width:64ch;
    line-height:1.6;
    font-size:14px;
    word-break:keep-all;
    overflow-wrap:break-word;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
  }
  .toolbar .group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .toolbar label.field-label{
    font-size:11px;color:var(--ink-soft);font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;margin-right:2px;
  }
  select{
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--ink);
    border-radius:8px;
    padding:7px 10px;
    font-size:13px;
    font-family:inherit;
  }
  select:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .spacer{flex:1;}
  .count-pill{
    font-size:12px;color:var(--ink-soft);
    background:var(--bg);border:1px solid var(--border);
    padding:6px 10px;border-radius:999px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    position:relative;
    transition:border-color .15s ease;
  }
  .card:has(.chk:checked){border-color:var(--accent);}
  .thumb{
    aspect-ratio:16/10;
    background:
      linear-gradient(135deg, var(--accent-soft), transparent 70%),
      repeating-linear-gradient(45deg, var(--border) 0 1px, transparent 1px 14px);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    font-size:12px;
    position:relative;
  }
  .thumb .ch-badge{
    position:absolute;top:8px;left:8px;
    font-size:10px;font-weight:700;letter-spacing:.03em;
    padding:4px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);
  }
  .thumb .new-badge{
    position:absolute;top:8px;right:36px;
    font-size:10px;font-weight:900;letter-spacing:.03em;
    padding:4px 8px;border-radius:999px;
    background:var(--accent);color:#fff;
  }
  .chk-wrap{
    position:absolute;top:8px;right:8px;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
  }
  .chk{
    width:18px;height:18px;cursor:pointer;accent-color:var(--accent);
  }
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .brand{font-size:12px;font-weight:700;color:var(--accent-ink);}
  .title{font-size:14px;font-weight:600;line-height:1.4;text-wrap:balance;}
  .meta{font-size:11.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .meta .dot{opacity:.5;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .tag{
    font-size:10.5px;padding:3px 8px;border-radius:999px;
    background:var(--bg);border:1px solid var(--border);color:var(--ink-soft);
  }
  .tag.status-실측{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent;}
  .tag.status-예시{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent;}
  .link{
    margin-top:auto;
    font-size:12px;color:var(--accent-ink);
    text-decoration:none;
    display:inline-flex;align-items:center;gap:4px;
  }
  .link:hover{text-decoration:underline;}

  .bottombar{
    position:fixed;left:0;right:0;bottom:0;
    padding:14px 16px;
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;justify-content:center;
    box-shadow:0 -8px 24px rgba(20,24,30,.08);
  }
  .bottombar-inner{
    max-width:1080px;width:100%;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .bottombar .sel-info{font-size:13px;color:var(--ink-soft);}
  .bottombar .sel-info b{color:var(--ink);}
  .btn{
    border:none;border-radius:9px;padding:10px 16px;
    font-size:13px;font-weight:700;cursor:pointer;
    font-family:inherit;
  }
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:disabled{background:var(--border);color:var(--ink-soft);cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}

  footer.note{
    max-width:1080px;margin:22px auto 0;
    font-size:11.5px;color:var(--ink-soft);
    border-top:1px dashed var(--border);
    padding-top:14px;line-height:1.6;
  }
</style>

</div>

    var m = String(str||"").match(/(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return null;
    return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  }
  function weekCycleOf(dateStr){
    var d = extractDate(dateStr);
    if(!d) return null;
    var iso = d.getDay()===0 ? 7 : d.getDay(); // 월=1 ... 일=7
    var diffFromWed = (iso - 3 + 7) % 7; // 그 주의 수요일로부터 며칠 지났는지
    var start = new Date(d); start.setDate(d.getDate()-diffFromWed);
    var end = new Date(start); end.setDate(start.getDate()+6);
    return { start:start, end:end, label: fmtMD(start)+"~"+fmtMD(end) };
  }
  var CURRENT_CYCLE = weekCycleOf(new Date().toISOString().slice(0,10));

  ITEMS.forEach(function(item){
    var c = weekCycleOf(item.date);
    item._cycle = c ? c.label : "확인필요";
    item._cycleStart = c ? c.start.getTime() : -1;
  });

  function uniq(arr){ return Array.from(new Set(arr)); }
  function fillSelect(sel, values, labelFn){
    values.forEach(function(v){
      var o = document.createElement("option");
      o.value = v; o.textContent = labelFn ? labelFn(v) : v;
      sel.appendChild(o);
    });
  }

  function channelShort(ch){
    if(ch==="인스타그램/캐러셀이미지") return "인스타그램 · 이미지";
    if(ch==="인스타그램/영상") return "인스타그램 · 영상";
    if(ch==="유튜브/영상") return "유튜브";
    return "메타 광고";
  }
  var STATUS_LABEL = { "실측":"확인완료", "예시":"예시", "확인필요":"확인 필요" };
  var STATUS_DESC = {
    "실측":"담당자가 원문을 직접 확인했어요",
    "예시":"화면 구성을 보여주는 샘플이에요",
    "확인필요":"원본이 사라져 다시 확인해야 해요"
  };
  function statusLabel(s){ return STATUS_LABEL[s] || s; }
  var TOPIC_DESC = {
    "경품응모형":"추첨을 통해 경품이나 쿠폰을 주는 이벤트예요",
    "신규가입혜택형":"신규 가입·계좌 개설 고객에게 혜택을 주는 이벤트예요",
    "시즌한정형":"명절 등 특정 시즌에 맞춘 한시적 이벤트예요",
    "제휴협업형":"다른 브랜드나 캐릭터와 협업한 이벤트예요",
    "앱기능연계형":"앱의 특정 기능 사용을 유도하는 이벤트예요"
  };

  var brandSel = document.getElementById("f-brand");
  var channelSel = document.getElementById("f-channel");
  var statusSel = document.getElementById("f-status");
  fillSelect(brandSel, uniq(ITEMS.map(function(i){return i.brand;})));
  fillSelect(channelSel, uniq(ITEMS.map(function(i){return i.channel;})), channelShort);
  fillSelect(statusSel, uniq(ITEMS.map(function(i){return i.status;})), statusLabel);

  function render(){
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var filtered = ITEMS.filter(function(i){
      return (!state.brand || i.brand===state.brand)
        && (!state.channel || i.channel===state.channel)
        && (!state.status || i.status===state.status);
    });
    document.getElementById("result-count").textContent = filtered.length + "건 표시 중";

    filtered.forEach(function(item, idx){
      var id = item.brand+"|"+item.title;
      var card = document.createElement("div");
      card.className = "card";
      var thumbInner = item.thumb
        ? '<img src="'+item.thumb+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:contain;background:#000;">'
        : '<span class="mono" style="font-size:11px;">썸네일 없음</span>';
      var newBadge = (item._cycle === CURRENT_CYCLE.label) ? '<span class="new-badge" title="이번 주(수요일~화요일)에 새로 올라온 콘텐츠예요">NEW</span>' : '';
      var topicTitle = TOPIC_DESC[item.topic] || "";
      var statusTitle = STATUS_DESC[item.status] || "";
      card.innerHTML =
        '<div class="thumb"><span class="ch-badge">'+channelShort(item.channel)+'</span>'+newBadge+
          thumbInner+
          '<div class="chk-wrap"><input type="checkbox" class="chk" data-id="'+id.replace(/"/g,'&quot;')+'" '+(state.selected.has(id)?"checked":"")+'></div>'+
        '</div>'+
        '<div class="body">'+
          '<div class="brand">'+item.brand+'</div>'+
          '<div class="title">'+item.title+'</div>'+
          '<div class="meta"><span class="mono">'+item.date+'</span></div>'+
          '<div class="tags"><span class="tag" title="'+topicTitle+'">'+item.topic+'</span><span class="tag status-'+item.status+'" title="'+statusTitle+'">'+statusLabel(item.status)+'</span></div>'+
          '<a class="link" href="'+item.url+'" target="_blank" rel="noopener">원문 보기 ↗</a>'+
        '</div>';
      grid.appendChild(card);
    });

    grid.querySelectorAll(".chk").forEach(function(chk){
      chk.addEventListener("change", function(){
        var id = chk.getAttribute("data-id");
        if(chk.checked){ state.selected.add(id); } else { state.selected.delete(id); }
        updateBottombar();
      });
    });
  }

  function updateBottombar(){
    document.getElementById("sel-count").textContent = state.selected.size;
    document.getElementById("pdf-btn").disabled = state.selected.size === 0;
  }

  brandSel.addEventListener("change", function(){ state.brand=brandSel.value; render(); });
  channelSel.addEventListener("change", function(){ state.channel=channelSel.value; render(); });
  statusSel.addEventListener("change", function(){ state.status=statusSel.value; render(); });

  document.getElementById("clear-btn").addEventListener("click", function(){
    state.selected.clear();
    render();
    updateBottombar();
  });

  document.getElementById("pdf-btn").addEventListener("click", function(){
    var chosen = ITEMS.filter(function(i){ return state.selected.has(i.brand+"|"+i.title); });
    if(!chosen.length) return;

    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if(!jsPDFCtor){ alert("PDF 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도해주세요."); return; }
    var doc = new jsPDFCtor({ orientation:"landscape", unit:"pt", format:"a4" });

    doc.setFont("helvetica","bold");
    doc.setFontSize(16);
    doc.text("경쟁사 SNS 콘텐츠 비교표", 40, 40);
    doc.setFont("helvetica","normal");
    doc.setFontSize(9);
    doc.setTextColor(110,110,110);
    var today = new Date().toISOString().slice(0,10);
    doc.text("생성일: " + today + "  |  선택 콘텐츠 " + chosen.length + "건", 40, 56);

    var rows = chosen.map(function(i){
      return [i.brand, i.title, channelShort(i.channel), i.date, i.topic, statusLabel(i.status), i.url];
    });

    doc.autoTable({
      startY: 72,
      head: [["경쟁사","콘텐츠 제목","채널","게시일","이벤트 유형","확인 상태","콘텐츠 URL"]],
      body: rows,
      styles: { font:"helvetica", fontSize:8, cellPadding:5, overflow:"linebreak" },
      headStyles: { fillColor:[14,110,92], textColor:255, fontStyle:"bold" },
      columnStyles: {
        0:{cellWidth:65}, 1:{cellWidth:150}, 2:{cellWidth:90}, 3:{cellWidth:60},
        4:{cellWidth:65}, 5:{cellWidth:45}, 6:{cellWidth:195}
      },
      theme:"grid"
    });

    var fname = "경쟁사콘텐츠_선택비교표_" + today.replace(/-/g,"") + ".pdf";
    var blob = doc.output("blob");

    if(window.claude && window.claude.use){
      window.claude.use("downloads").then(function(downloads){
        if(!downloads){ fallbackOpen(blob, fname); return; }
        downloads.save({ filename: fname, data: blob }).catch(function(){
          fallbackOpen(blob, fname);
        });
      }).catch(function(){ fallbackOpen(blob, fname); });
    } else {
      fallbackOpen(blob, fname);
    }
  });

  function fallbackOpen(blob, fname){
    var url = URL.createObjectURL(blob);
    window.open(url, "_blank");
  }

  render();
  updateBottombar();
})();
</script>
